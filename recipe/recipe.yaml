schema_version: 1

context:
  name: enpt_enmapboxapp
  version: "1.4.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/enpt_enmapboxapp-${{ version }}.tar.gz
  sha256: f5f72349299897001ac46a723e62810b6a8595951093842e42b711cf2d0d3ff5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - hatchling 
    - python ${{ python_min }}.*
    - pip
  run:
    - enmapbox-lite
    - enpt >=1.5.0
    - packaging
    - psutil
    - python >=${{ python_min }}
    - qgis >=3.40.0
  run_constraints:
    - arosics !=1.9.2  # scikit-image version pinning out of sync (relevant for python<=3.11)

tests:
  - python:
      imports:
        - enpt_enmapboxapp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A QGIS EnMAPBox plugin providing a GUI for the EnMAP processing tool (EnPT).
  license: GPL-3.0-or-later
  license_file: LICENSE
  homepage: https://git.gfz-potsdam.de/EnMAP/GFZ_Tools_EnMAP_BOX/enpt_enmapboxapp

extra:
  recipe-maintainers:
    - danschef
